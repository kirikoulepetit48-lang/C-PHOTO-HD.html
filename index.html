<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C PHOTO HD - Impression élégante</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
h1{font-size:2.5rem;margin-top:20px;letter-spacing:2px;}
h1 span{color:#c8a96a;}
.subtitle{color:#888;margin:10px 0 30px;}
.upload-box{border:2px dashed #333;width:100%;max-width:600px;height:300px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#111;transition:0.3s;position:relative;overflow:hidden;}
.upload-box:hover{border-color:#c8a96a;background:#151515;}
.upload-box img.preview{position:absolute;width:100%;height:100%;object-fit:cover;display:none;}
.upload-box p{color:#666;}
.btn{background:#c8a96a;color:#000;border:none;padding:14px 40px;border-radius:30px;font-weight:bold;font-size:1rem;cursor:pointer;margin-top:20px;transition:0.3s;}
.btn:disabled{background:#333;color:#555;cursor:not-allowed;}
.result{margin-top:30px;width:100%;max-width:900px;display:none;grid-template-columns:1fr 1fr;gap:20px;}
.card{background:#111;border-radius:20px;padding:10px;overflow:hidden;}
.card p{text-align:center;padding:10px;color:#888;font-size:0.9rem;}
.card img{width:100%;border-radius:15px;}
#status{margin-top:20px;color:#c8a96a;display:none;}
</style>
</head>
<body>
<h1>C PHOTO <span>HD</span></h1>
<p class="subtitle">Impression élégante - Amélioration IA x2 + netteté</p>

<div class="upload-box" id="uploadBox" onclick="document.getElementById('fileInput').click()">
  <p id="uploadText">📸 Cliquez pour importer une photo</p>
  <img id="preview" class="preview">
</div>

<input type="file" id="fileInput" accept="image/*" hidden>

<button class="btn" id="enhanceBtn" disabled>Améliorer en HD</button>
<p id="status">Traitement en cours...</p>

<div class="result" id="result">
  <div class="card"><p>AVANT</p><img id="beforeImg"></div>
  <div class="card"><p>APRÈS HD</p><img id="afterImg"><a id="downloadLink" class="btn" style="display:block;text-align:center;margin:10px;text-decoration:none;">Télécharger HD</a></div>
</div>

<script>
const BACKEND_URL = "https://cliply-backend-ywvj.onrender.com/enhance";
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const uploadText = document.getElementById('uploadText');
const enhanceBtn = document.getElementById('enhanceBtn');
const beforeImg = document.getElementById('beforeImg');
const afterImg = document.getElementById('afterImg');
const result = document.getElementById('result');
const status = document.getElementById('status');
let selectedFile = null;

fileInput.onchange = e => {
  selectedFile = e.target.files[0];
  if(!selectedFile) return;
  const url = URL.createObjectURL(selectedFile);
  preview.src = url;
  preview.style.display = 'block';
  uploadText.style.display = 'none';
  beforeImg.src = url;
  enhanceBtn.disabled = false;
};

enhanceBtn.onclick = async () => {
  if(!selectedFile) return;
  enhanceBtn.disabled = true;
  status.style.display = 'block';
  status.textContent = 'Amélioration HD en cours...';
  const formData = new FormData();
  formData.append('image', selectedFile);
  try {
    const res = await fetch(BACKEND_URL, { method: 'POST', body: formData });
    if(!res.ok) throw new Error('Erreur serveur');
    const blob = await res.blob();
    const hdUrl = URL.createObjectURL(blob);
    afterImg.src = hdUrl;
    document.getElementById('downloadLink').href = hdUrl;
    document.getElementById('downloadLink').download = 'c-photo-hd.jpg';
    result.style.display = 'grid';
    status.textContent = 'Terminé ✅';
  } catch(err) {
    status.textContent = 'Erreur: ' + err.message;
  }
  enhanceBtn.disabled = false;
};
</script>
</body>
  </html>
