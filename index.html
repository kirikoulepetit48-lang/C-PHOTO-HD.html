<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C PHOTO HD MAX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:2.8rem;margin-top:10px}h1 span{color:#c8a96a}
.sub{color:#777;margin-bottom:20px}
.box{border:2px dashed #444;width:100%;max-width:500px;height:320px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#111;cursor:pointer;overflow:hidden;position:relative}
.box img{width:100%;height:100%;object-fit:cover;display:none;position:absolute}
.btn{background:#c8a96a;color:#000;padding:16px 40px;border-radius:30px;font-weight:900;border:none;margin-top:22px;cursor:pointer;font-size:1.1rem}
.res{width:100%;max-width:900px;display:none;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}
.card{background:#111;padding:10px;border-radius:16px}.card img{width:100%;border-radius:12px}
#stat{margin-top:15px;color:#c8a96a;min-height:20px}
</style>
</head>
<body>
<h1>C PHOTO <span>HD</span></h1><p class="sub">HD MAX x2 - Local - Sans serveur</p>
<div class="box" id="box" onclick="file.click()"><p id="txt">📸 Choisis ta photo</p><img id="prev"></div>
<input type="file" id="file" hidden accept="image/*">
<button class="btn" id="go">AMÉLIORER EN HD MAX</button>
<p id="stat"></p>
<div class="res" id="res">
<div class="card"><p>AVANT</p><img id="before"></div>
<div class="card"><p>APRÈS HD MAX</p><img id="after"><a id="dl" class="btn" style="display:block;text-align:center;margin-top:10px;text-decoration:none;font-size:1rem" download="C-PHOTO-HD.jpg">📥 TÉLÉCHARGER HD</a></div>
</div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const file=document.getElementById('file'), prev=document.getElementById('prev'), txt=document.getElementById('txt'), before=document.getElementById('before'), after=document.getElementById('after'), res=document.getElementById('res'), stat=document.getElementById('stat'), go=document.getElementById('go'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let loadedImg=null;
file.onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{
  prev.src=ev.target.result; prev.style.display='block'; txt.style.display='none'; before.src=ev.target.result;
  loadedImg=new Image(); loadedImg.onload=()=>{stat.textContent='Photo prête ✅ Clique sur AMÉLIORER'}; loadedImg.src=ev.target.result;
 };
 r.readAsDataURL(f);
};
go.onclick=()=>{
 if(!loadedImg){alert('Choisis photo');return;}
 stat.textContent='Amélioration HD MAX en cours...';
 setTimeout(()=>{
  const w=loadedImg.width*2, h=loadedImg.height*2;
  canvas.width=w; canvas.height=h;
  // Filtre haute qualité
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.filter='contrast(1.15) brightness(1.05) saturate(1.2) sharpen(1)';
  // Upscale x2
  ctx.drawImage(loadedImg,0,0,w,h);
  // Deuxième passe netteté
  ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=0.15;
  ctx.drawImage(loadedImg,0,0,w,h);
  ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
  const url=canvas.toDataURL('image/jpeg',0.95);
  after.src=url; document.getElementById('dl').href=url; res.style.display='grid';
  stat.textContent='Terminé ✅ HD MAX x2 - Tu peux télécharger';
 }, 300);
};
</script>
</body>
</html>
