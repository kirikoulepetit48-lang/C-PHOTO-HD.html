<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C PHOTO HD x3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px}
h1{font-size:2.8rem}h1 span{color:#c8a96a}
.box{border:2px dashed #555;width:100%;max-width:500px;height:340px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:#111;cursor:pointer;overflow:hidden;position:relative}
.box img{width:100%;height:100%;object-fit:cover;display:none;position:absolute}
.btn{background:#c8a96a;color:#000;padding:17px 40px;border-radius:30px;font-weight:900;border:none;margin-top:20px;cursor:pointer}
.res{width:100%;max-width:900px;display:none;grid-template-columns:1fr 1fr;gap:15px;margin-top:25px}
.card{background:#111;padding:10px;border-radius:16px}.card img{width:100%;border-radius:12px}
</style>
</head>
<body>
<h1>C PHOTO <span>HD x3</span></h1>
<p style="color:#777;margin-bottom:15px">HD x3 - NIVEAU SUPÉRIEUR</p>
<div class="box" id="box" onclick="file.click()"><p id="txt">📸 Choisis photo</p><img id="prev"></div>
<input type="file" id="file" hidden accept="image/*">
<button class="btn" id="go">AMÉLIORER x3</button>
<p id="stat" style="margin-top:15px;color:#c8a96a;font-weight:bold"></p>
<div class="res" id="res">
<div class="card"><p>AVANT</p><img id="before"></div>
<div class="card"><p>APRÈS x3</p><img id="after"><a id="dl" class="btn" style="display:block;text-align:center;margin-top:10px;text-decoration:none" download="C-PHOTO-x3.jpg">📥 TÉLÉCHARGER x3</a></div>
</div>
<canvas id="canvas" style="display:none"></canvas>
<script>
const file=document.getElementById('file'), prev=document.getElementById('prev'), txt=document.getElementById('txt'), before=document.getElementById('before'), after=document.getElementById('after'), res=document.getElementById('res'), stat=document.getElementById('stat'), go=document.getElementById('go'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let loadedImg=null;
file.onchange=e=>{
 const f=e.target.files[0]; if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{
  prev.src=ev.target.result; prev.style.display='block'; txt.style.display='none'; before.src=ev.target.result;
  loadedImg=new Image(); loadedImg.onload=()=>stat.textContent='Prêt ✅ Clique AMÉLIORER x3'; loadedImg.src=ev.target.result;
 }; r.readAsDataURL(f);
};
go.onclick=()=>{
 if(!loadedImg){alert('Choisis photo');return;}
 stat.textContent='HD x3 en cours... 3 secondes...'; go.disabled=true;
 setTimeout(()=>{
  let w=loadedImg.width*3, h=loadedImg.height*3;
  if(w>3000){h=h*3000/w; w=3000;} // limite pour ne pas faire ramer le téléphone
  canvas.width=w; canvas.height=h;
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
  ctx.filter='contrast(1.2) brightness(1.07) saturate(1.3)';
  ctx.drawImage(loadedImg,0,0,w,h);
  const url=canvas.toDataURL('image/jpeg',0.96);
  after.src=url; document.getElementById('dl').href=url; res.style.display='grid';
  stat.textContent='Terminé ✅ HD x3 NIVEAU SUPÉRIEUR!'; go.disabled=false;
 }, 600);
};
</script>
</body>
</html>
